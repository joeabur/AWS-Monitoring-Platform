services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://monitor:monitor-local-only@db:5432/monitoring}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONITORED_AWS_ACCOUNTS: "${MONITORED_AWS_ACCOUNTS:-[]}"
      EXPECTED_IAM_USERS: ${EXPECTED_IAM_USERS:-}
      TRUSTED_IP_CIDRS: ${TRUSTED_IP_CIDRS:-}
      SENSITIVE_RESOURCE_ARNS: ${SENSITIVE_RESOURCE_ARNS:-}
      RESPONSE_ACTIONS_ENABLED: ${RESPONSE_ACTIONS_ENABLED:-false}
      RESPONSE_DRY_RUN: ${RESPONSE_DRY_RUN:-true}
      NOTIFICATION_MIN_SEVERITY: ${NOTIFICATION_MIN_SEVERITY:-high}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      MIGRATIONS_ON_STARTUP: ${MIGRATIONS_ON_STARTUP:-true}
      MCP_ENABLED: ${MCP_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-local}
        NEXT_PUBLIC_COGNITO_ISSUER: ${COGNITO_ISSUER:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
        NEXT_PUBLIC_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-}
        NEXT_PUBLIC_COGNITO_POST_LOGOUT_REDIRECT_URI: ${COGNITO_POST_LOGOUT_REDIRECT_URI:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-}
      COGNITO_POST_LOGOUT_REDIRECT_URI: ${COGNITO_POST_LOGOUT_REDIRECT_URI:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"

volumes:
  postgres-data:
