name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - run: ruff format --check app tests
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt
        working-directory: backend
      - run: DATABASE_URL=sqlite:////tmp/monitoring-ci.db alembic upgrade head
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run build

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform/modules/cloudtrail-event-pipeline
      - run: terraform validate
        working-directory: infrastructure/terraform/modules/cloudtrail-event-pipeline
      - run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform/environments/production
      - run: terraform validate
        working-directory: infrastructure/terraform/environments/production
